name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install pytest
      - run: python -m pytest -q --junitxml=report.xml
      - run: python scripts/test_summary.py report.xml docs/assets/test-summary.json
      - uses: actions/upload-artifact@v4
        with:
          name: test-summary
          path: docs/assets/test-summary.json
